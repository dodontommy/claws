[package]
name = "claws-tui"
version = "0.4.0"
edition = "2021"
description = "TUI multiplexer for Claude Code sessions"
repository = "https://github.com/dodontommy/claws-tui"
homepage = "https://github.com/dodontommy/claws-tui"
license = "MIT OR Apache-2.0"
readme = "README.md"

[package.metadata.dist]
dist = true

# Crate published as `claws-tui` (the existing `claws` slot on crates.io is
# claimed by an unrelated AWS TUI). The user-facing binary keeps its short
# name — `brew install …/claws-tui` then `claws` to run it.
[[bin]]
name = "claws"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Cross-platform exclusive file locks. Used to guarantee exactly one daemon
# process at a time — kernel auto-releases the lock if the holder dies for
# any reason, including SIGKILL. No timeouts, no PID checking, no race window.
fs4 = "0.8"
axoupdater = { version = "0.10", features = ["github_releases"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5"
futures = "0.3"
interprocess = { version = "2", features = ["tokio"] }
portable-pty = "0.8"
ratatui = "0.29"
rusqlite = { version = "0.31", features = ["bundled"] }
shell-words = "1"
vt100 = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Phone companion (PWA over HTTP/WS).
# TLS for non-localhost binds is deferred — Phase 1 binds 127.0.0.1 and expects
# the user to front it with `tailscale serve --https` or `cloudflared tunnel`,
# both of which terminate TLS for us. Phase 4 will add a self-signed-cert mode
# for users who want raw LAN binding without an external fronting service.
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
qrcode = { version = "0.14", default-features = false }
rand = "0.8"
# Web Push (VAPID + aes128gcm). hyper-client transitively pulls native-tls
# (hyper-tls) and openssl (ece). On Windows we vendor openssl-sys below so
# CI doesn't need a system OpenSSL on PATH.
web-push = { version = "0.10", default-features = false, features = ["hyper-client"] }
# Direct dep for VAPID keypair generation. Matches web-push's transitive
# version so we share one copy.
jwt-simple = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Force web-push's transitive openssl-sys to vendor on Windows so CI doesn't
# need a preinstalled OpenSSL. Strawberry Perl on the GHA runner is enough
# to build it from source.
[target.'cfg(windows)'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"] }

[profile.dev]
opt-level = 0
debug = 1
incremental = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
