[package]
name = "claws"
version = "0.1.1"
edition = "2021"
description = "TUI multiplexer for Claude Code sessions"
repository = "https://github.com/dodontommy/multi-claude"
homepage = "https://github.com/dodontommy/multi-claude"
license = "MIT OR Apache-2.0"
readme = "README.md"

[package.metadata.dist]
dist = true

[[bin]]
name = "claws"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "5"
futures = "0.3"
interprocess = { version = "2", features = ["tokio"] }
portable-pty = "0.8"
ratatui = "0.29"
rusqlite = { version = "0.31", features = ["bundled"] }
shell-words = "1"
vt100 = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "time", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 0
debug = 1
incremental = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
