<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1e1e2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="claws" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="stylesheet" href="/vendor/xterm/xterm.css" />
<title>claws</title>
<style>
  :root {
    --bg: #1e1e2e;
    --bg2: #181825;
    --panel: #313244;
    --line: #45475a;
    --fg: #cdd6f4;
    --dim: #a6adc8;
    --muted: #6c7086;
    --accent: #89b4fa;
    --good: #a6e3a1;
    --warn: #f9e2af;
    --bad: #f38ba8;
    --danger: #fab387;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  .app { display: flex; flex-direction: column; height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--bg2); border-bottom: 1px solid var(--line);
    font-weight: 600;
  }
  header .title { flex: 1; }
  header .conn { font-size: 12px; color: var(--muted); }
  header .conn.live { color: var(--good); }
  header .conn.gone { color: var(--bad); }
  .view { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  /* List view */
  .list { flex: 1; overflow-y: auto; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .row:active { background: var(--panel); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.idle { background: var(--accent); }
  .dot.streaming { background: var(--good); animation: pulse 1.5s infinite; }
  .dot.awaiting_permission { background: var(--warn); animation: pulse 0.8s infinite; }
  .dot.spawning { background: var(--dim); }
  .dot.exited { background: var(--muted); }
  .dot.resume_failed { background: var(--bad); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .row .meta { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .state { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .row .danger { color: var(--danger); margin-left: 4px; font-weight: 700; }

  /* Detail view */
  .detail-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--bg2); border-bottom: 1px solid var(--line);
  }
  .detail-bar .back { background: none; border: none; padding: 4px 8px; font-size: 18px; }
  .detail-bar .name { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail-bar .menu { background: none; border: none; padding: 4px 8px; font-size: 18px; }
  /* PTY mount: just a flex container; the xterm host gets re-parented in. */
  .pty-mount { flex: 1; min-height: 0; background: #000; position: relative; overflow: hidden; }
  .term-host { width: 100%; height: 100%; padding: 6px 8px 0; }
  .term-host[hidden] { display: none !important; }
  /* xterm internals: kill the focus ring, dim the scrollbar a bit. */
  .term-host .xterm { padding: 0; height: 100%; }
  .term-host .xterm-viewport { background: transparent !important; }
  .term-host .xterm-screen { background: transparent !important; }
  .term-host .xterm-viewport::-webkit-scrollbar { width: 4px; }
  .term-host .xterm-viewport::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }
  .input-bar {
    display: flex; gap: 6px; padding: 8px;
    background: var(--bg2); border-top: 1px solid var(--line);
  }
  .input-bar input,
  .input-bar textarea {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 10px 12px; outline: none; min-width: 0;
    font: 14px ui-sans-serif, system-ui, sans-serif;
    resize: none; line-height: 1.4;
  }
  .input-bar input:focus,
  .input-bar textarea:focus { border-color: var(--accent); }
  .input-bar button {
    background: var(--accent); color: var(--bg); border: none; border-radius: 8px;
    padding: 10px 14px; font-weight: 600;
  }
  .chips { display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; background: var(--bg2); border-top: 1px solid var(--line); }
  .chip {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    padding: 6px 12px; border-radius: 16px; font-size: 13px; white-space: nowrap;
  }
  .chip:active { background: var(--line); }

  /* iOS input proxy. type=password sidesteps iOS IME completion (see
     xterm.js#2403). Pinned to the top of the viewport at 1px size so
     iOS doesn't scroll/transform layout when summoning the keyboard —
     the input is already in view, no adjustment needed. Invisible to
     the user; the keystroke pipe is purely functional. */
  .ptype-form { margin: 0; position: absolute; top: 0; left: 0; pointer-events: none; }
  .ptype {
    position: fixed; top: 0; left: 0;
    width: 1px; height: 1px;
    border: none; outline: none; padding: 0; margin: 0;
    background: transparent; color: transparent;
    /* font-size: 16px prevents iOS from auto-zooming on focus. */
    font-size: 16px;
    opacity: 0;
    pointer-events: auto;
    -webkit-appearance: none;
    z-index: 1;
  }

  /* Permission prompt banner — shown above the PTY when status is awaiting_permission. */
  .prompt-banner {
    background: var(--panel); border-bottom: 1px solid var(--warn);
    padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .prompt-title { color: var(--warn); font-weight: 700; font-size: 14px; }
  .prompt-title .tool { color: var(--fg); font-weight: 600; }
  .prompt-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .prompt-btn {
    flex: 1; min-width: 100px; border: none; border-radius: 8px;
    padding: 12px 10px; font-weight: 600; font-size: 14px;
  }
  .prompt-btn.allow { background: var(--good); color: var(--bg); }
  .prompt-btn.allow-all { background: var(--accent); color: var(--bg); }
  .prompt-btn.deny { background: var(--bad); color: var(--bg); }
  .prompt-btn:active { opacity: 0.85; }

  /* Header + button */
  .hdr-btn {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    width: 32px; height: 32px; border-radius: 16px; font-size: 18px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .hdr-btn:active { background: var(--line); }

  /* Bottom-sheet spawn form */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 100; padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet {
    width: 100%; background: var(--bg2); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; padding: 18px 18px 24px;
    display: flex; flex-direction: column; gap: 8px;
    max-height: 88vh; overflow-y: auto;
  }
  .sheet-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
  .sheet-label { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .sheet-label .sheet-hint { font-weight: 400; font-style: italic; }
  .sheet-input {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 10px 12px; outline: none; font-size: 14px;
  }
  .sheet-input:focus { border-color: var(--accent); }
  .model-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .model-pill {
    background: var(--panel); border: 1px solid var(--line); color: var(--dim);
    padding: 8px 14px; border-radius: 16px; font-size: 13px; font-weight: 500;
  }
  .model-pill.selected {
    background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700;
  }
  .sheet-err { color: var(--bad); font-size: 13px; margin-top: 4px; }
  .sheet-actions { display: flex; gap: 8px; margin-top: 14px; }
  .sheet-cancel, .sheet-submit {
    flex: 1; border: none; border-radius: 8px; padding: 12px; font-weight: 600; font-size: 15px;
  }
  .sheet-cancel { background: var(--panel); color: var(--fg); border: 1px solid var(--line); }
  .sheet-submit { background: var(--accent); color: var(--bg); }
  .sheet-submit:disabled { opacity: 0.6; }

  /* Pairing */
  .pair { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; height: 100%; justify-content: center; }
  .pair h1 { margin: 0; font-size: 18px; }
  .pair p { color: var(--dim); text-align: center; max-width: 320px; margin: 0; line-height: 1.5; }
  .pair input { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; max-width: 320px; outline: none; }
  .pair button { background: var(--accent); color: var(--bg); border: none; border-radius: 8px; padding: 12px 20px; font-weight: 600; width: 100%; max-width: 320px; }
  .pair .err { color: var(--bad); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; }

  /* Ace-style iOS input proxy. 1×1 fixed in the viewport so its geometry
     never changes; opacity 0 + pointer-events none so it's invisible and
     untouchable. Focus is summoned synchronously from a touchend handler
     on the terminal host, not from tapping this element. */
  #ios-input {
    position: fixed;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    border: 0;
    padding: 0;
    margin: 0;
    resize: none;
    pointer-events: none;
    z-index: 1;
    /* font-size: 16px is required to keep iOS from auto-zooming on focus. */
    font-size: 16px;
  }
</style>
</head>
<body>
<!-- iOS keyboard input proxy, Ace editor pattern (src/keyboard/textinput.js).
     Positioned fixed at viewport top, 1x1 transparent, never reparented.
     iOS Safari dismisses the keyboard if the focused element's geometry
     changes, gets reparented, OR its value gets set to "". We satisfy
     all three rules: position is fixed independent of ancestor reflow,
     this element lives at body root and never moves, and the value
     cycles only between PLACEHOLDER and PLACEHOLDER+keystrokes (see
     app.js). Decoupled from #app so xterm's render loop can't disturb it. -->
<textarea
  id="ios-input"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="off"
  spellcheck="false"
  wrap="off"
  aria-hidden="true"
  tabindex="-1"></textarea>
<!-- Self-nuke. Visit `?reset=1` to unregister the service worker and
     drop all caches before any other script loads. Lives inline because
     a stale cached app.js would otherwise prevent its own replacement. -->
<script>
  (function () {
    if (!new URL(location.href).searchParams.get("reset")) return;
    document.body.innerText = "resetting…";
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        if (window.caches) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
      } catch (e) { /* best effort */ }
      location.replace("/");
    })();
    // Halt the rest of body parsing — the unregister + reload finishes the job.
    throw new Error("claws PWA reset");
  })();
</script>
<div id="app" class="app"></div>
<!-- xterm.js terminal host. Lives outside #app so the rerender loop in
     app.js doesn't tear down its DOM (xterm manages its own internals
     and breaks if its node is replaced). It's hidden when not in detail
     view and re-parented into #pty-mount when entering one. -->
<div id="term-host" class="term-host" hidden></div>
<script src="/vendor/xterm/xterm.js"></script>
<script src="/vendor/xterm/xterm-addon-fit.js"></script>
<script type="module" src="/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('sw register failed', e));
    });
  }
</script>
</body>
</html>
