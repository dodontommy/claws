<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#1e1e2e" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="claws" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<link rel="apple-touch-icon" href="/icon-180.png" />
<title>claws</title>
<style>
  :root {
    --bg: #1e1e2e;
    --bg2: #181825;
    --panel: #313244;
    --line: #45475a;
    --fg: #cdd6f4;
    --dim: #a6adc8;
    --muted: #6c7086;
    --accent: #89b4fa;
    --good: #a6e3a1;
    --warn: #f9e2af;
    --bad: #f38ba8;
    --danger: #fab387;
  }
  html, body { background: var(--bg); color: var(--fg); }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  * { box-sizing: border-box; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }
  .app { display: flex; flex-direction: column; height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--bg2); border-bottom: 1px solid var(--line);
    font-weight: 600;
  }
  header .title { flex: 1; }
  header .conn { font-size: 12px; color: var(--muted); }
  header .conn.live { color: var(--good); }
  header .conn.gone { color: var(--bad); }
  .view { flex: 1; overflow: hidden; display: flex; flex-direction: column; }

  /* List view */
  .list { flex: 1; overflow-y: auto; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .row:active { background: var(--panel); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.idle { background: var(--accent); }
  .dot.streaming { background: var(--good); animation: pulse 1.5s infinite; }
  .dot.awaiting_permission { background: var(--warn); animation: pulse 0.8s infinite; }
  .dot.spawning { background: var(--dim); }
  .dot.exited { background: var(--muted); }
  .dot.resume_failed { background: var(--bad); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .row .meta { flex: 1; min-width: 0; }
  .row .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .state { font-size: 11px; color: var(--dim); white-space: nowrap; }
  .row .danger { color: var(--danger); margin-left: 4px; font-weight: 700; }

  /* Detail view */
  .detail-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: var(--bg2); border-bottom: 1px solid var(--line);
  }
  .detail-bar .back { background: none; border: none; padding: 4px 8px; font-size: 18px; }
  .detail-bar .name { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail-bar .menu { background: none; border: none; padding: 4px 8px; font-size: 18px; }
  .pty {
    flex: 1; overflow-y: auto; padding: 8px 12px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; line-height: 1.4;
    background: var(--bg); white-space: pre-wrap; word-break: break-word;
  }
  .pty .line { min-height: 1em; }
  .input-bar {
    display: flex; gap: 6px; padding: 8px;
    background: var(--bg2); border-top: 1px solid var(--line);
  }
  .input-bar input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 10px 12px; outline: none; min-width: 0;
  }
  .input-bar input:focus { border-color: var(--accent); }
  .input-bar button {
    background: var(--accent); color: var(--bg); border: none; border-radius: 8px;
    padding: 10px 14px; font-weight: 600;
  }
  .chips { display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; background: var(--bg2); border-top: 1px solid var(--line); }
  .chip {
    background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    padding: 6px 12px; border-radius: 16px; font-size: 13px; white-space: nowrap;
  }
  .chip:active { background: var(--line); }

  /* Permission prompt banner — shown above the PTY when status is awaiting_permission. */
  .prompt-banner {
    background: var(--panel); border-bottom: 1px solid var(--warn);
    padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .prompt-title { color: var(--warn); font-weight: 700; font-size: 14px; }
  .prompt-title .tool { color: var(--fg); font-weight: 600; }
  .prompt-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .prompt-btn {
    flex: 1; min-width: 100px; border: none; border-radius: 8px;
    padding: 12px 10px; font-weight: 600; font-size: 14px;
  }
  .prompt-btn.allow { background: var(--good); color: var(--bg); }
  .prompt-btn.allow-all { background: var(--accent); color: var(--bg); }
  .prompt-btn.deny { background: var(--bad); color: var(--bg); }
  .prompt-btn:active { opacity: 0.85; }

  /* Pairing */
  .pair { padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; height: 100%; justify-content: center; }
  .pair h1 { margin: 0; font-size: 18px; }
  .pair p { color: var(--dim); text-align: center; max-width: 320px; margin: 0; line-height: 1.5; }
  .pair input { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; max-width: 320px; outline: none; }
  .pair button { background: var(--accent); color: var(--bg); border: none; border-radius: 8px; padding: 12px 20px; font-weight: 600; width: 100%; max-width: 320px; }
  .pair .err { color: var(--bad); font-size: 13px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; }
</style>
</head>
<body>
<div id="app" class="app"></div>
<script type="module" src="/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch((e) => console.warn('sw register failed', e));
    });
  }
</script>
</body>
</html>
